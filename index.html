<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的第一个网页</title>
    <style>
        /* 这里是 CSS，负责好看 */
        body {
            background-color: #f0f8ff; /* 浅蓝色背景 */
            text-align: center;
            font-family: sans-serif;
            margin-top: 50px;
        }
        h1 {
            color: #333; /* 深灰色字体 */
        }
        p {
            color: #666;
            font-size: 18px;
        }
        .box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            margin: 0 auto; /* 居中 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 阴影 */
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>你好，世界！</h1>
        <p>这是我亲手写的第一个网页。</p>
        <p>今天天气不错，学习进度 +1</p>
        <a href="https://www.baidu.com" target="_blank">点我跳转到百度</a>
    </div>
</body>
</html>
